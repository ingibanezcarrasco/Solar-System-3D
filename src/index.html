<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Solar 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cargando" class="cargando"><div class="anillo"></div><span>Cargando el sistema solar…</span></div>

  <div id="etiquetas" class="etiquetas" aria-hidden="true"></div>

  <h1 class="marca">SISTEMA SOLAR</h1>

  <!-- Barra superior: búsqueda y distancia -->
  <div class="barra-sup panel">
    <label class="buscar">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="buscar" type="search" placeholder="Buscar" autocomplete="off" aria-label="Buscar un cuerpo celeste">
      <ul id="sugerencias" class="sugerencias" hidden></ul>
    </label>
    <div class="dist"><span>Distancia al Sol</span><b id="distValor">—</b><small id="distUnidad"></small></div>
  </div>

  <!-- Panel izquierdo: controles -->
  <aside id="panelIzq" class="panel panel-izq">
    <button id="btnVista" class="fila-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      VISTA GENERAL
    </button>

    <div class="seccion">
      <div class="seccion-tit"><span>TIEMPO</span><b id="velTexto">1x</b></div>
      <div class="rejilla4" id="velocidades">
        <button data-v="0" title="Pausa">❚❚</button>
        <button data-v="0.1">0.1x</button>
        <button data-v="1" class="activo">1x</button>
        <button data-v="5">5x</button>
        <button data-v="20">20x</button>
        <button data-v="50">50x</button>
        <button data-v="100">100x</button>
        <button data-v="-1" title="Invertir el sentido">⇄</button>
      </div>
    </div>

    <div class="seccion">
      <div class="seccion-tit"><span>BRILLO DEL SOL</span><b id="solTexto">1.9</b></div>
      <input id="solBrillo" type="range" min="1" max="6" step="0.1" value="1.9" aria-label="Brillo del Sol">
    </div>

    <div class="seccion">
      <div class="seccion-tit"><span>MOSTRAR EN LA ESCENA</span></div>
      <div class="toggles">
        <button class="toggle activo" data-t="orbitas">ÓRBITAS</button>
        <button class="toggle activo" data-t="nombres">NOMBRES</button>
        <button class="toggle activo" data-t="asteroides">ASTEROIDES</button>
        <button class="toggle activo" data-t="lunas">LUNAS</button>
        <button class="toggle" data-t="giro">GIRO AUTOMÁTICO</button>
        <button class="toggle activo" data-t="brillo">RESPLANDOR</button>
      </div>
    </div>

    <div class="seccion">
      <div class="seccion-tit"><span>ÍNDICE DE OBJETOS</span></div>
      <ul id="indice" class="indice"></ul>
    </div>
  </aside>
  <button id="plegar" class="panel plegar" aria-label="Plegar panel" title="Plegar panel">‹</button>

  <!-- Panel derecho: ficha del cuerpo -->
  <aside id="ficha" class="panel ficha" hidden>
    <div class="ficha-cab">
      <span id="fichaMini"></span>
      <button id="fichaCerrar" class="icono" aria-label="Cerrar ficha">✕</button>
    </div>
    <div class="ficha-cuerpo">
      <h2 id="fichaNombre"></h2>
      <p id="fichaTipo" class="tipo"></p>
      <p id="fichaDesc" class="desc"></p>
      <h3>De un vistazo</h3>
      <dl id="fichaDatos" class="datos"></dl>
      <div id="fichaExtra"></div>
    </div>
    <button id="fichaVolver" class="volver">← Volver a la vista general</button>
  </aside>

  <!-- Navegador inferior -->
  <div class="nav-inf">
    <div class="panel navegador">
      <button id="anterior" aria-label="Anterior">‹</button>
      <span id="navNombre">Sistema solar</span>
      <button id="siguiente" aria-label="Siguiente">›</button>
    </div>
    <div class="ayuda">
      <span><kbd>ARRASTRAR</kbd> Girar</span>
      <span><kbd>RUEDA</kbd> Zoom</span>
      <span><kbd>CLIC</kbd> Seleccionar</span>
      <span class="solo-pc"><kbd>← →</kbd> Cambiar</span>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
